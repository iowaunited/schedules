<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iowa United Tournaments</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="Iowa_United_Icon.png">
    
    <!-- Tailwind CSS for modern, responsive sports dashboard design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for clean sports icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a',
                        secondary: '#3b82f6',
                        accent: '#f59e0b',
                        darkBg: '#0f172a'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen w-full overflow-x-hidden">

    <!-- Top Header Navigation -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- Custom Local Icon Image Container -->
                <div class="bg-slate-900 border border-slate-700 p-1 rounded-xl shadow-lg flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 overflow-hidden shrink-0">
                    <img src="Iowa_United_Icon.png" alt="Iowa United Icon" class="w-full h-full object-cover rounded-lg">
                </div>
                <div>
                    <h1 id="teamName" class="text-base sm:text-xl font-bold tracking-tight text-white">Iowa United</h1>
                    <p class="text-[11px] sm:text-xs text-slate-400">Tourney Hub</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- YouTube Channel Link Button -->
                <a id="youtubeLink" href="#" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="hidden px-3 py-1.5 sm:px-3.5 sm:py-2 text-xs sm:text-sm font-medium rounded-lg bg-red-600/20 text-red-400 border border-red-500/30 hover:bg-red-600/30 transition flex items-center space-x-1.5 sm:space-x-2"
                   title="Visit YouTube Channel">
                    <i class="fa-brands fa-youtube text-base sm:text-lg"></i>
                    <span class="hidden sm:inline">YouTube</span>
                </a>

                <div id="youtubeDivider" class="hidden h-6 w-px bg-slate-700 mx-1"></div>

                <button onclick="switchView('cards')" id="cardsBtn" class="px-3 py-1.5 sm:px-3.5 sm:py-2 text-xs sm:text-sm font-medium rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition flex items-center space-x-1.5 sm:space-x-2">
                    <i class="fa-solid fa-grid-2"></i><span>Cards</span>
                </button>
                <button onclick="switchView('table')" id="tableBtn" class="px-3 py-1.5 sm:px-3.5 sm:py-2 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition shadow flex items-center space-x-1.5 sm:space-x-2">
                    <i class="fa-solid fa-table-list"></i><span>Table</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-xl mx-auto px-4 py-6 w-full box-border">

        <!-- Team Picker (shown when no ?team= is in the URL) -->
        <div id="teamPicker" class="hidden">
            <h2 class="text-lg font-bold text-white mb-4">Pick your team</h2>
            <div id="teamList" class="grid grid-cols-1 gap-3"></div>
        </div>

        <!-- Filter & Search Bar -->
        <div id="searchBar" class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-3.5 sm:p-4 mb-6 sm:mb-8 w-full box-border shadow-sm">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterTournaments()" placeholder="Search tournaments, cities, hotels..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition box-border">
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingIndicator" class="flex flex-col items-center justify-center py-20">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p class="text-slate-400 text-sm font-medium">Loading live tournament schedule from Google Sheet...</p>
        </div>

        <!-- Cards View Container -->
        <div id="cardsView" class="w-full grid grid-cols-1 gap-4 sm:gap-6 hidden">
            <!-- Dynamically populated -->
        </div>

        <!-- Table View Container -->
        <div id="tableView" class="w-full max-w-full bg-slate-800/80 border border-slate-700/60 rounded-2xl shadow-sm overflow-hidden hidden">
            <div class="overflow-x-auto w-full -webkit-overflow-scrolling-touch">
                <table class="w-full text-left border-collapse text-xs sm:text-sm">
                    <thead>
                        <tr class="bg-slate-900/60 border-b border-slate-700 text-slate-400 uppercase text-[10px] sm:text-xs tracking-wider">
                            <th class="py-3 px-3 sm:px-4 font-semibold whitespace-nowrap">Dates</th>
                            <th class="py-3 px-3 sm:px-4 font-semibold">Tournament</th>
                            <th class="py-3 px-3 sm:px-4 font-semibold whitespace-nowrap">Location</th>
                            <th class="py-3 px-3 sm:px-4 font-semibold">Hotel</th>
                            <th class="py-3 px-3 sm:px-4 font-semibold whitespace-nowrap">Teams</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-700/60 text-slate-200">
                        <!-- Dynamically populated -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <div class="w-16 h-16 bg-slate-800 text-slate-500 rounded-full flex items-center justify-center text-2xl mb-4">
                <i class="fa-solid fa-calendar-xmark"></i>
            </div>
            <h3 class="text-lg font-bold text-slate-300">No tournaments found</h3>
            <p class="text-sm text-slate-500 mt-1">Try adjusting your search query.</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-16 sm:mt-20 border-t border-slate-800 py-6 text-center text-xs text-slate-500 px-4">
        <p><span id="footerTeam">Iowa United</span> Volleyball Club &copy; 2027 &bull; Live Google Sheets Synchronization</p>
    </footer>

    <!-- Frontend Script communicating with Google Apps Script backend -->
    <script>
        // Paste the Web app URL from your Apps Script deployment here
        const API_URL = 'https://script.google.com/macros/s/AKfycbwWEKoahfb0y4Tz6H-N3kL0TYPRng0uAphY3wSWPNXJMGuAuOxWEqjwNbc4A-_MiD5j/exec';

        // Which team? Comes from the link, e.g. .../iowa-united-tournaments/?team=141E
        const TEAM = new URLSearchParams(location.search).get('team');

        let allTournaments = [];
        let currentView = 'cards';

        function showError(message) {
            document.getElementById('loadingIndicator').innerHTML = `
                <div class="text-red-400 mb-2"><i class="fa-solid fa-triangle-exclamation text-2xl"></i></div>
                <p class="text-red-300 text-sm font-medium">Failed to load schedule from Google Sheets.</p>
                <p class="text-slate-500 text-xs mt-1">${message}</p>
            `;
        }

        function loadData() {
            const url = TEAM ? `${API_URL}?team=${encodeURIComponent(TEAM)}` : API_URL;
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    if (data.error) throw new Error(data.error);
                    document.getElementById('loadingIndicator').classList.add('hidden');
                    if (!TEAM) { renderTeamPicker(data.teams || []); return; }
                    applyTeamInfo(data.team || { Team: TEAM });
                    allTournaments = data.tournaments || [];
                    renderTournaments(allTournaments);
                    switchView('cards');
                })
                .catch(error => showError(error.message || error));
        }

        // Fills in the header, page title, footer and YouTube button for this team
        function applyTeamInfo(team) {
            const name = team.Name || team.Team;
            document.getElementById('teamName').textContent = name;
            document.getElementById('footerTeam').textContent = `Iowa United ${team.Team}`;
            document.title = `Iowa United ${team.Team} Tournaments`;
            if (team.YouTube) {
                const yt = document.getElementById('youtubeLink');
                yt.href = team.YouTube;
                yt.classList.remove('hidden');
                yt.classList.add('flex');
                document.getElementById('youtubeDivider').classList.remove('hidden');
            }
        }

        // Landing page with no ?team= : list every team from the Teams tab
        function renderTeamPicker(teams) {
            ['searchBar', 'cardsBtn', 'tableBtn'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById('teamPicker').classList.remove('hidden');
            document.getElementById('teamList').innerHTML = teams.map(t => `
                <a href="?team=${encodeURIComponent(t.Team)}" class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 hover:border-blue-500 transition flex items-center justify-between">
                    <span class="font-bold text-white">${t.Name || t.Team}</span>
                    <span class="text-xs text-slate-400">${t.Team}</span>
                </a>
            `).join('');
        }

        function switchView(view) {
            currentView = view;
            const cardsView = document.getElementById('cardsView');
            const tableView = document.getElementById('tableView');
            const cardsBtn = document.getElementById('cardsBtn');
            const tableBtn = document.getElementById('tableBtn');

            if (view === 'cards') {
                cardsView.classList.remove('hidden');
                tableView.classList.add('hidden');
                cardsBtn.className = "px-3 py-1.5 sm:px-3.5 sm:py-2 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition shadow flex items-center space-x-1.5 sm:space-x-2";
                tableBtn.className = "px-3 py-1.5 sm:px-3.5 sm:py-2 text-xs sm:text-sm font-medium rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition flex items-center space-x-1.5 sm:space-x-2";
            } else {
                cardsView.classList.add('hidden');
                tableView.classList.remove('hidden');
                tableBtn.className = "px-3 py-1.5 sm:px-3.5 sm:py-2 text-xs sm:text-sm font-medium rounded-lg bg-blue-600 text-white transition shadow flex items-center space-x-1.5 sm:space-x-2";
                cardsBtn.className = "px-3 py-1.5 sm:px-3.5 sm:py-2 text-xs sm:text-sm font-medium rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition flex items-center space-x-1.5 sm:space-x-2";
            }
        }

        function filterTournaments() {
            const query = document.getElementById('searchInput').value.toLowerCase();

            const filtered = allTournaments.filter(t => {
                const matchesQuery = Object.values(t).some(val => 
                    String(val).toLowerCase().includes(query)
                );
                return matchesQuery;
            });

            renderTournaments(filtered);
        }

        function renderTournaments(data) {
            const cardsContainer = document.getElementById('cardsView');
            const tableBody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');

            if (!data || data.length === 0) {
                cardsContainer.innerHTML = '';
                tableBody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            // Populate Cards
            cardsContainer.innerHTML = data.map(t => {
                // Note the capitalization matching your sheet headers: Tournament, Hotel, Registration
                const tourneyDisplay = t.TournamentUrl 
                    ? `<a href="${t.TournamentUrl}" target="_blank" class="text-blue-400 hover:underline font-bold">${t.Tournament} <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i></a>`
                    : `<span class="text-white font-bold">${t.Tournament || 'Tournament'}</span>`;
            
                const hotelDisplay = t.HotelUrl 
                    ? `<a href="${t.HotelUrl}" target="_blank" class="text-emerald-400 hover:underline font-medium">${t.Hotel} <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i></a>`
                    : `<span class="text-slate-200">${t.Hotel || 'No Hotel Assigned'}</span>`;
            
                const regDisplay = t.RegistrationUrl 
                    ? `<a href="${t.RegistrationUrl}" target="_blank" class="text-blue-400 hover:underline font-semibold bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-700">${t.Registration} <i class="fa-solid fa-arrow-up-right-from-square text-xs ml-1"></i></a>`
                    : `<span class="text-slate-200 font-semibold bg-slate-900 px-2.5 py-1 rounded-lg border border-slate-700">${t.Registration || 'Pending'}</span>`;
            
                return `
                    <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-4 sm:p-5 hover:border-slate-600 transition shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] sm:text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20">
                                    <i class="fa-regular fa-calendar mr-1.5"></i> ${t.Dates || 'TBD'}
                                </span>
                            </div>
                            <h3 class="text-base sm:text-lg mb-2">${tourneyDisplay}</h3>
                            <div class="space-y-2 text-xs text-slate-300 mt-4">
                                <div class="flex items-center text-slate-400">
                                    <i class="fa-solid fa-location-dot w-5 text-blue-400 shrink-0"></i>
                                    <span class="text-slate-200 truncate">${t.Location || 'Location TBD'}</span>
                                </div>
                                <div class="flex items-center text-slate-400">
                                    <i class="fa-solid fa-hotel w-5 text-emerald-400 shrink-0"></i>
                                    <span class="truncate">${hotelDisplay}</span>
                                </div>
                            </div>
                        </div>
                        ${t.Registration ? `<div class="mt-4 pt-3 border-t border-slate-700/60 flex items-center justify-between text-xs">
                            <span class="text-slate-400 font-medium">Teams:</span>
                            <div>${regDisplay}</div>
                        </div>` : ''}
                    </div>
                `;
            }).join('');
            
            // Populate Table (Do the same for your table mapping loop)
            tableBody.innerHTML = data.map(t => {
                const tourneyLink = t.TournamentUrl 
                    ? `<a href="${t.TournamentUrl}" target="_blank" class="text-blue-400 hover:underline font-semibold">${t.Tournament}</a>`
                    : `<span class="font-semibold text-white">${t.Tournament || '--'}</span>`;
            
                const hotelLink = t.HotelUrl 
                    ? `<a href="${t.HotelUrl}" target="_blank" class="text-emerald-400 hover:underline">${t.Hotel}</a>`
                    : `<span>${t.Hotel || '--'}</span>`;
            
                const regLink = t.RegistrationUrl 
                    ? `<a href="${t.RegistrationUrl}" target="_blank" class="text-blue-400 hover:underline font-medium">${t.Registration}</a>`
                    : `<span>${t.Registration || '--'}</span>`;
            
                return `
                    <tr class="hover:bg-slate-700/30 transition">
                        <td class="py-3 px-3 sm:px-4 font-medium text-blue-400 whitespace-nowrap">${t.Dates || '--'}</td>
                        <td class="py-3 px-3 sm:px-4">${tourneyLink}</td>
                        <td class="py-3 px-3 sm:px-4 text-slate-300 whitespace-nowrap">${t.Location || '--'}</td>
                        <td class="py-3 px-3 sm:px-4 text-slate-300">${hotelLink}</td>
                        <td class="py-3 px-3 sm:px-4 text-slate-300 whitespace-nowrap">${regLink}</td>
                    </tr>
                `;
            }).join('');
        }

        // Initialize load on page startup
        window.onload = loadData;
    </script>
</body>
</html>
